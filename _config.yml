title: "刘雅轩 | Yaxuan Liu"
description: "刘雅轩的个人学术主页与研究博客 | Academic website and research blog of Yaxuan Liu"
url: "https://liuyaxuan33.github.io"
baseurl: ""
lang: "zh-CN"
timezone: "Asia/Shanghai"

# GitHub Discussions comments powered by Giscus.
# After enabling Discussions and installing the Giscus app, copy the two IDs
# generated by https://giscus.app/zh-CN and switch enabled to true.
giscus:
  enabled: true
  repo: "LiuYaxuan33/LiuYaxuan33.github.io"
  repo_id: "R_kgDOT3SsLQ"
  category: "Announcements"
  category_id: "DIC_kwDOT3SsLc4DDTR2"
  mapping: "pathname"
  strict: "1"
  reactions_enabled: "1"
  input_position: "top"
  theme: "light"
  lang: "zh-CN"

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - CONTENT_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - data.html
  - files/data
  - vendor
  - outputs
  - work
