---
layout: default
---
<article class="post container narrow">
  <header class="post-header">
    <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}"><span class="lang-zh">研究博客</span><span class="lang-en">Research blog</span></a></p>
    <h1 class="lang-zh">{{ page.title_zh | default: page.title }}</h1>
    <h1 class="lang-en">{{ page.title_en | default: page.title }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>{% if page.tags.size > 0 %}<span> · {{ page.tags | join: " · " }}</span>{% endif %}</p>
  </header>
  <div class="prose">{{ content }}</div>
  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">← <span class="lang-zh">返回全部文章</span><span class="lang-en">All posts</span></a>
  </footer>
</article>
