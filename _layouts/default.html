<!doctype html>
<html lang="zh-CN" class="js-loading">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#496750">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <script>(function(){try{var l=localStorage.getItem('site-language');if(l==='en'){document.documentElement.dataset.initialLang='en';document.documentElement.lang='en';}}catch(e){}})();</script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body data-lang="zh">
    <a class="skip-link lang-zh" href="#main">跳到正文</a>
    <a class="skip-link lang-en" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
