<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <strong>{{ site.data.profile.name_zh }} · {{ site.data.profile.name_en }}</strong>
      <p><span class="lang-zh">个人主页</span><span class="lang-en">Personal Website</span></p>
    </div>
    <div class="footer-right">
      {% for email in site.data.profile.emails %}{% if email.address != "" %}<a href="mailto:{{ email.address }}">{{ email.address }}</a>{% unless forloop.last %}<br>{% endunless %}{% endif %}{% endfor %}
      <p>© <span id="current-year">2026</span> {{ site.data.profile.name_en }}</p>
    </div>
  </div>
</footer>
