- title_zh: "台湾耕地所有权与经营状况调查数据集（1950）"
  title_en: "Taiwan Cultivated Land Ownership and Operation Survey Dataset (1950)"
  version: "1.0"
  updated: "2026-08-13"
  related_paper: "From Land to Liquidity: Compensation Design and Local Population Reallocation in Taiwan’s Land-to-the-Tiller Reform"
  description_zh: "数据以1950年《耕地之所有与经营状况调查报告书》所列地方为观测单位，覆盖台湾省当时19个县市或管理局、43个区合计和255个乡镇级记录。主要变量包括水田与旱地面积、自耕农与佃农经营面积、私有耕地所有者的持有面积分组，以及公有耕地的登记类型和放租状态。"
  description_en: "The dataset is organized by localities reported in the 1950 Survey Report on Cultivated Land Ownership and Operation, covering 19 contemporary counties, cities, or administrative authorities, 43 district totals, and 255 township-level records in Taiwan Province. Key variables include paddy and dryland acreage, land operated by owner-cultivators and tenants, private landowners by holding-size class, and public cultivated land by registration and lease status."
  format: "CSV / XLSX"
