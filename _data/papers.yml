- title: "From Land to Liquidity: Compensation Design and Local Population Reallocation in Taiwan’s Land-to-the-Tiller Reform"
  authors: "Yaxuan Liu"
  year: "2026"
  type: "progress"
  featured: true
  status_zh: "本科生科研阶段性成果"
  status_en: "Undergraduate Research Progress"
  journal: ""
  abstract_zh: >-
    本文利用《实施耕者有其田条例》 (民国42年1月26日)及其后续修正案中对耕地征收之补偿方式的规定设计因果识别策略，提供“耕者有其田”通过将土地资产释放为流动性促进农村乡镇的人口流出的定量证据。
  abstract_en: >-
    This paper uses the provisions on compensation methods for cultivated land expropriation in the Land-to-the-Tiller Reform Act (January 26, 1953) and its subsequent amendments to design a causal identification strategy, providing quantitative evidence that the Land-to-the-Tiller Reform promoted rural township population outflows by releasing land assets into liquidity.
