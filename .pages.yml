media:
  input: assets/images/blog
  output: /assets/images/blog
  rename: safe
  categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "blog: create {filename}"
      update: "blog: update {filename}"
      delete: "blog: remove {filename}"
      rename: "blog: rename {oldFilename} to {newFilename}"

content:
  - name: posts
    label: 我的文章
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
      field: false
    view:
      primary: title_zh
      fields: [title_zh, date, published, tags]
      sort: [date, title_zh]
      search: [title_zh, title_en, excerpt_zh, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title_zh
        label: 标题
        type: string
        required: true
      - name: title_en
        label: 英文标题
        type: string
        required: true
      - name: excerpt_zh
        label: 列表摘要
        type: text
        required: true
        description: "显示在博客首页，一两句话即可。"
        options:
          maxlength: 240
      - name: excerpt_en
        label: 英文摘要
        type: text
        required: true
        options:
          maxlength: 240
      - name: tags
        label: 标签（如：随笔、游记）
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
      - name: body_en
        label: 英文正文（可选）
        type: rich-text
        options:
          format: markdown
          switcher: false
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: published
        label: 发布到网站
        type: boolean
        default: false
        description: "关闭就是草稿；写好后打开，再保存一次即可上线。"
      - name: comments
        label: 允许读者评论
        type: boolean
        default: true
